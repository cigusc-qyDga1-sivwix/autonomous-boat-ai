name: BOAT LAB nationwide auto forecasts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/autonomous_daily.py'
      - 'scripts/conditional_second_primary.py'
      - 'tests/test_conditional_second_primary.py'
      - 'scripts/official_withdrawals.py'
      - 'scripts/interaction_scenarios.py'
      - 'scripts/justified_main_points.py'
      - 'scripts/turn_three_pilot.py'
      - 'scripts/main_v07_bridge.js'
      - 'scripts/main_v09_bridge.js'
      - 'scripts/main_four_factor_bridge.js'
      - 'scripts/main_point_free_bridge.js'
      - 'scripts/racer_context.py'
      - 'scripts/freeze_statistical_shadow.py'
      - 'scripts/audit_statistical_shadow.py'
      - 'boat_ai/statistical.py'
      - 'app/data/statistical/latest-model.json'
      - 'app/four-factor.js'
      - 'scripts/entry_exhibition_gate.py'
      - 'scripts/test_entry_exhibition_gate.py'
      - 'scripts/venue_profiles.py'
      - 'scripts/export_venue_profiles.py'
      - 'scripts/ingest_boatracecsv_exhibition.py'
      - 'scripts/research_outside_roles.py'
      - 'scripts/research_coupling_patterns.py'
      - 'scripts/research_wake_hypotheses.py'
      - 'scripts/research_start_gap.py'
      - 'scripts/freeze_start_trials.js'
      - 'scripts/freeze_coupling_trials.js'
      - 'scripts/freeze_second_place_trials.js'
      - 'app/tests/forward-second-place-shadow.test.js'
      - 'scripts/exhibition_bridge.py'
      - 'scripts/exhibition_rejection_audit.py'
      - 'scripts/exhibition_second_chance.py'
      - 'tests/test_exhibition_second_chance.py'
      - 'scripts/test_exhibition_rejection_audit.py'
      - 'scripts/freeze_tactical_trials.js'
      - 'scripts/freeze_outside_trials.js'
      - 'scripts/freeze_wake_trials.js'
      - 'app/tactical-1m.js'
      - 'app/exhibition-audit.js'
      - '.github/workflows/boat-lab-auto.yml'
  workflow_run:
    workflows: ['BOAT LAB one-off retrospective exhibition replay']
    types: [completed]
  schedule:
    # JST 06:00-23:59 every 5 minutes, best effort.
    # GitHub-hosted cron may be delayed or skipped; the UI shows freshness.
    # Stagger forecast, result-only, and backlog jobs away from minute zero.
    - cron: '2-59/5 21-23 * * *'
    - cron: '2-59/5 0-14 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: boat-lab-nationwide
  cancel-in-progress: false

jobs:
  collect-forecast-publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
    steps:
      # Generate the local calendar day before checkout. The single required
      # dated ledger must be materialized even on the first race of the day.
      - name: Resolve JST archive date
        id: jst_day
        shell: bash
        run: echo "day=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      # actions/checkout v4 automatically uses a blobless partial fetch for
      # sparse-checkout. Preserve default token authentication and all history
      # in Git; only omit old daily forecast blobs from this runner workspace.
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/app/data/live/20??-??-??.json
            /app/data/live/${{ steps.jst_day.outputs.day }}.json
      - name: Verify sparse checkout retained today's immutable forecast
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/autonomous_daily.py
          test -f scripts/ingest_boatracecsv_exhibition.py
          test -f app/data/live/latest.json
          test -f app/data/exhibition/status-latest.json
          DAY="${{ steps.jst_day.outputs.day }}"
          if git ls-files --error-unmatch "app/data/live/$DAY.json" >/dev/null 2>&1; then
            test -f "app/data/live/$DAY.json" || { echo "Today's ledger was not checked out" >&2; exit 1; }
          fi
          if git status --porcelain | grep -q '^ D app/data/live/'; then
            echo "Archive files must not be deleted or staged as missing" >&2
            exit 1
          fi
          git config --get remote.origin.promisor || echo '::warning::Git partial clone disabled'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical main model bridge before forecasting
        run: |
          node --check scripts/main_v07_bridge.js
          node --check scripts/main_v09_bridge.js
          node --check scripts/main_four_factor_bridge.js
          node --check scripts/main_point_free_bridge.js
          node --check app/four-factor.js
          node app/tests/four-factor.test.js
          python -m unittest discover -s tests -p test_racer_context.py
          node --check app/tactical-1m.js
          python -m compileall -q scripts/autonomous_daily.py
          python -m compileall -q scripts/conditional_second_primary.py
      - name: Verify exhibition ingestion and pre-cutoff freeze invariants
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_exhibition_ingest_optional_weather.py
          python scripts/test_exhibition_rejection_audit.py
          python -m unittest discover -s tests -p test_exhibition_second_chance.py
          python -m unittest discover -s tests -p test_attack_defence_shadow.py
          python -m unittest discover -s tests -p test_grade_competition_shadow.py
          python -m unittest discover -s tests -p test_grade_competition_integration.py
          # The former Mikuni replay test no longer exists in this repository.
          python scripts/test_entry_exhibition_gate.py
      - name: Collect exhibition measurements before forecasting
        continue-on-error: true
        run: |
          if [ "$(TZ=Asia/Tokyo date +%F)" != "${{ steps.jst_day.outputs.day }}" ]; then
            echo "::error::JST day rolled over during checkout; refuse stale daily ledger"
            exit 1
          fi
          python scripts/ingest_boatracecsv_exhibition.py --previews-only
          python -m json.tool app/data/exhibition/status-latest.json > /dev/null
          # No results here can revise an immutable forecast or official settlement.
      - name: Collect all available venues and freeze only pre-cutoff forecasts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/export_venue_profiles.py
          python scripts/autonomous_daily.py | tee boat-lab-daily-status.json
          python -m json.tool app/data/live/latest.json > /dev/null
          # Read-only forecast diagnostics; does not modify frozen predictions.
          python scripts/forecast_audit.py --input app/data/live/latest.json --out app/data/live/audit-latest.json
          python -m json.tool app/data/live/audit-latest.json > /dev/null
          DAY=$(TZ=Asia/Tokyo date +%F)
          python scripts/exhibition_rejection_audit.py --date "$DAY" || echo "::warning::Exhibition gap audit failed; forecast publishing remains enabled"
      # CRITICAL PATH: save immutable forecast and six-boat exhibition evidence
      # BEFORE slower retrospective research, shadow freezes and model audits.
      # This reduces the chance that a pre-cutoff fixed forecast only exists
      # on a runner when the next result writer commits to main.
      - name: Publish pre-cutoff exhibition forecasts immediately
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(TZ=Asia/Tokyo date +%F)" != "${{ steps.jst_day.outputs.day }}" ]; then
            echo "::error::JST day rolled over; do not publish an unmaterialized daily ledger"
            exit 1
          fi
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add app/data/live/ app/data/exhibition/ app/data/venue-profiles.json
          if ! git diff --cached --quiet; then
            git commit -m 'forecast: publish pre-cutoff exhibition snapshots first'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo 'Forecast-first publication succeeded'
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo 'Forecast-first save retry exhausted' >&2
                exit 1
              fi
              # Another trusted result writer won the race. Rebuild from its
              # latest immutable ledger; NEVER force push or backdate forecasts.
              git fetch origin main
              git reset --hard origin/main
              python scripts/ingest_boatracecsv_exhibition.py --previews-only
              python scripts/export_venue_profiles.py
              python scripts/autonomous_daily.py | tee boat-lab-daily-status.json
              python scripts/forecast_audit.py --input app/data/live/latest.json --out app/data/live/audit-latest.json
              DAY=$(TZ=Asia/Tokyo date +%F)
              python scripts/exhibition_rejection_audit.py --date "$DAY" || echo '::warning::Exhibition gap audit unavailable'
              git add app/data/live/ app/data/exhibition/ app/data/venue-profiles.json
              if git diff --cached --quiet; then
                echo 'No new immutable forecast after safe rebase'
                break
              fi
              git commit -m 'forecast: rebuild from latest immutable ledger before cutoff'
            done
          fi
      # A race's exhibition may become available during the first publish.
      # Recheck ONLY previews and run another live pre-cutoff forecast if new
      # six-boat evidence arrives while there is still a 180-second lead.
      - name: Second-chance capture of new six-boat exhibition previews
        id: second_chance
        shell: bash
        run: |
          set -euo pipefail
          DAY="${{ steps.jst_day.outputs.day }}"
          if [ "$(TZ=Asia/Tokyo date +%F)" != "$DAY" ]; then
            echo "::warning::JST day changed; skip second-chance capture"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="$RUNNER_TEMP/exhibition-before-recheck.json"
          AFTER="app/data/exhibition/$DAY.json"
          if [ -f "$AFTER" ]; then
            cp "$AFTER" "$BEFORE"
          else
            echo '{}' > "$BEFORE"
          fi
          if ! python scripts/ingest_boatracecsv_exhibition.py --previews-only; then
            echo "::warning::CSV recheck failed; checking Open API independently"
            AFTER="$BEFORE"
          fi
          python -m scripts.exhibition_second_chance \
            --before "$BEFORE" --after "$AFTER" --ledger "app/data/live/$DAY.json" --github-output "$GITHUB_OUTPUT"

      - name: Immediately freeze and publish second-chance exhibition forecasts
        if: steps.second_chance.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DAY="${{ steps.jst_day.outputs.day }}"
          if [ "$(TZ=Asia/Tokyo date +%F)" != "$DAY" ]; then
            echo "::warning::JST day changed; no second-chance forecast"
            exit 0
          fi
          # The live collector re-fetches the current OpenAPI, verifies input,
          # and enforces the wall-clock cutoff both before and after computing.
          # Research result/payout CSVs are NOT fetched in this step.
          python scripts/autonomous_daily.py | tee boat-lab-second-chance-status.json
          python scripts/forecast_audit.py --input app/data/live/latest.json --out app/data/live/audit-latest.json
          python scripts/exhibition_rejection_audit.py --date "$DAY" || echo "::warning::Second-chance gap audit unavailable"
          git add app/data/live/ app/data/exhibition/ app/data/venue-profiles.json
          if ! git diff --cached --quiet; then
            git commit -m 'forecast: publish safe second-chance exhibition snapshots'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo 'Second-chance pre-cutoff publication succeeded'
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo '::error::Second-chance publication could not be saved'
                exit 1
              fi
              # Concurrent trusted official-result writer: never force-push.
              # Rebuild from the latest committed immutable ledger, using
              # fresh capture times (no retrospective promotion).
              git fetch origin main
              git reset --hard origin/main
              python scripts/ingest_boatracecsv_exhibition.py --previews-only
              python scripts/autonomous_daily.py | tee boat-lab-second-chance-status.json
              python scripts/forecast_audit.py --input app/data/live/latest.json --out app/data/live/audit-latest.json
              python scripts/exhibition_rejection_audit.py --date "$DAY" || echo '::warning::Gap audit unavailable'
              git add app/data/live/ app/data/exhibition/ app/data/venue-profiles.json
              if git diff --cached --quiet; then
                echo 'No new safe second-chance snapshot after rebase'
                break
              fi
              git commit -m 'forecast: revalidate second-chance previews after rebase'
            done
          fi
      - name: Freeze conditional second-place shadow before slow research
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node app/tests/forward-second-place-shadow.test.js
          node scripts/freeze_second_place_trials.js
      # Persist the shadow before slower retrospective collectors can delay
      # its GitHub record past cutoff. Main formal forecast is already committed.
      - name: Analyze research only after primary pre-cutoff revisions are frozen
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          DAY="${{ steps.jst_day.outputs.day }}"
          TRIAL="app/data/experiments/conditional-second-$DAY.json"
          STATUS="app/data/experiments/conditional-second-status-latest.json"
          if [ ! -f "$TRIAL" ] || [ ! -f "$STATUS" ]; then
            echo 'Shadow not available, primary forecast remains intact'
            exit 0
          fi
          NEW=$(python -c 'import json,sys;print(json.load(open(sys.argv[1])).get("new_forward_freezes",0))' "$STATUS")
          if [ "$NEW" -eq 0 ]; then
            echo 'No new pre-cutoff shadow freezes'
            exit 0
          fi
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add "$TRIAL" "$STATUS"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: publish pre-cutoff conditional-second shadow'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo 'Independent conditional-second shadow published'
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo '::warning::Shadow publish retry exhausted; formal predictions unaffected'
              break
            fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/freeze_second_place_trials.js || break
            NEW=$(python -c 'import json,sys;print(json.load(open(sys.argv[1])).get("new_forward_freezes",0))' "$STATUS")
            if [ "$NEW" -eq 0 ]; then
              echo 'Cutoff no longer allows a new shadow freeze'
              break
            fi
            git add "$TRIAL" "$STATUS"
            if git diff --cached --quiet; then break; fi
            git commit -m 'research: revalidate conditional-second shadow after rebase'
          done
      - name: Run slower retrospective research after shadow publication
        continue-on-error: true
        run: |
          python scripts/ingest_boatracecsv_exhibition.py
          python scripts/research_outside_roles.py
          python -m scripts.research_coupling_patterns
          python -m scripts.research_wake_hypotheses
          python -m scripts.research_start_gap
      - name: 28 Oct three-venue turn-motion research audit (no video downloads)
        continue-on-error: true
        run: |
          if [ "$(TZ=Asia/Tokyo date +%F)" = "2026-10-28" ]; then
            python scripts/turn_three_pilot.py --date 2026-10-28
          fi
      - name: Forward-freeze original vs tactical A/B forecast while cutoff is ahead
        shell: bash
        run: |
          set -euo pipefail
          node scripts/freeze_tactical_trials.js
          python -m json.tool app/data/experiments/status-latest.json > /dev/null
      - name: Forward-freeze v0.1 vs outside-makuri v0.2 on separate ledgers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/freeze_outside_trials.js
          python -m json.tool app/data/experiments/outside-status-latest.json > /dev/null
      - name: Independently freeze v0.5 versus six-boat coupling v0.6
        shell: bash
        run: |
          set -euo pipefail
          node scripts/freeze_coupling_trials.js
          python -m json.tool app/data/experiments/coupling-status-latest.json > /dev/null
      - name: Forward-freeze v0.6 against outside-ST interaction v0.7
        shell: bash
        run: |
          set -euo pipefail
          node scripts/freeze_start_trials.js
          python -m json.tool app/data/experiments/outside-start-status-latest.json > /dev/null
      - name: Freeze learned statistical comparison before cutoff
        continue-on-error: true
        run: |
          python -m scripts.freeze_statistical_shadow
          # Historical statistical audits require all prior daily ledgers,
          # which this critical-path checkout intentionally omits. The
          # independent boat-lab-statistical workflow retains full archives.
      # Background-value research runs only after the primary ledger has
      # reached main. Never retry a formal forecast from this stage.
      - name: Persist independent shadow and retrospective research
        shell: bash
        run: |
          set -euo pipefail
          git add app/data/experiments/ app/data/exhibition/ app/data/statistical/prospective-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish separate post-forecast trial evidence'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo 'Shadow research publication succeeded'
                break
              fi
              if [ "$attempt" = 3 ]; then
                # A research publish failure must not invalidate a successfully
                # frozen forecast already persisted in main.
                echo '::warning::Shadow research save retry exhausted'
                break
              fi
              git fetch origin main
              git reset --hard origin/main
              python scripts/ingest_boatracecsv_exhibition.py
              python scripts/research_outside_roles.py
              python -m scripts.research_coupling_patterns
              python -m scripts.research_wake_hypotheses
              python -m scripts.research_start_gap
              node scripts/freeze_tactical_trials.js
              node scripts/freeze_outside_trials.js
              node scripts/freeze_coupling_trials.js
              node scripts/freeze_second_place_trials.js || echo '::warning::Conditional-second research unavailable'
              node scripts/freeze_start_trials.js
              python -m scripts.freeze_statistical_shadow || echo '::warning::Statistical research unavailable'
              # The full-history statistical audit is maintained by the
              # separate boat-lab-statistical workflow.
              git add app/data/experiments/ app/data/exhibition/ app/data/statistical/prospective-audit.json
              if git diff --cached --quiet; then
                echo 'No new shadow trial evidence'
                break
              fi
              git commit -m 'research: re-evaluate trials on newest immutable ledger'
            done
          fi
      # The single Pages publisher reads fresh main after this workflow succeeds.
      - name: Keep run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-lab-auto-status-${{ github.run_attempt }}
          path: |
            boat-lab-daily-status.json
            boat-lab-second-chance-status.json
          if-no-files-found: ignore
          retention-days: 3
