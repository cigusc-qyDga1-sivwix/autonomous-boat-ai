name: BOAT LAB nationwide auto forecasts

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/autonomous_daily.py'
      - 'scripts/main_v07_bridge.js'
      - 'scripts/main_v09_bridge.js'
      - 'scripts/entry_exhibition_gate.py'
      - 'scripts/test_entry_exhibition_gate.py'
      - 'scripts/venue_profiles.py'
      - 'scripts/export_venue_profiles.py'
      - 'scripts/ingest_boatracecsv_exhibition.py'
      - 'scripts/research_outside_roles.py'
      - 'scripts/research_coupling_patterns.py'
      - 'scripts/research_wake_hypotheses.py'
      - 'scripts/research_start_gap.py'
      - 'scripts/freeze_start_trials.js'
      - 'scripts/freeze_coupling_trials.js'
      - 'scripts/exhibition_bridge.py'
      - 'scripts/freeze_tactical_trials.js'
      - 'scripts/freeze_outside_trials.js'
      - 'scripts/freeze_wake_trials.js'
      - 'app/tactical-1m.js'
      - 'app/exhibition-audit.js'
      - '.github/workflows/boat-lab-auto.yml'
  schedule:
    # JST 06:00-23:59 every 5 minutes, best effort.
    # GitHub-hosted cron may be delayed or skipped; the UI shows freshness.
    - cron: '*/5 21-23 * * *'
    - cron: '*/5 0-14 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: boat-lab-nationwide
  cancel-in-progress: false

jobs:
  collect-forecast-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical main model bridge before forecasting
        run: |
          node --check scripts/main_v07_bridge.js
          node --check scripts/main_v09_bridge.js
          node --check app/tactical-1m.js
          python -m compileall -q scripts/autonomous_daily.py
      - name: Collect exhibition measurements before forecasting
        continue-on-error: true
        run: |
          python scripts/ingest_boatracecsv_exhibition.py
          python -m json.tool app/data/exhibition/status-latest.json > /dev/null
          # No results here can revise an immutable forecast or official settlement.
      - name: Collect all available venues and freeze only pre-cutoff forecasts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/export_venue_profiles.py
          python scripts/autonomous_daily.py | tee boat-lab-daily-status.json
          python -m json.tool app/data/live/latest.json > /dev/null
          # Read-only forecast diagnostics; does not modify frozen predictions.
          python scripts/forecast_audit.py --input app/data/live/latest.json --out app/data/live/audit-latest.json
          python -m json.tool app/data/live/audit-latest.json > /dev/null
      - name: Analyze research only after primary pre-cutoff revisions are frozen
        continue-on-error: true
        run: |
          python scripts/research_outside_roles.py
          python -m scripts.research_coupling_patterns
          python -m scripts.research_wake_hypotheses
          python -m scripts.research_start_gap
      - name: Forward-freeze original vs tactical A/B forecast while cutoff is ahead
        shell: bash
        run: |
          set -euo pipefail
          node scripts/freeze_tactical_trials.js
          python -m json.tool app/data/experiments/status-latest.json > /dev/null
      - name: Forward-freeze v0.1 vs outside-makuri v0.2 on separate ledgers
        shell: bash
        run: |
          set -euo pipefail
          node scripts/freeze_outside_trials.js
          python -m json.tool app/data/experiments/outside-status-latest.json > /dev/null
      - name: Independently freeze v0.5 versus six-boat coupling v0.6
        shell: bash
        run: |
          set -euo pipefail
          node scripts/freeze_coupling_trials.js
          python -m json.tool app/data/experiments/coupling-status-latest.json > /dev/null
      - name: Forward-freeze v0.6 against outside-ST interaction v0.7
        shell: bash
        run: |
          set -euo pipefail
          node scripts/freeze_start_trials.js
          python -m json.tool app/data/experiments/outside-start-status-latest.json > /dev/null
      - name: Persist predictions and immutable version history
        shell: bash
        run: |
          set -euo pipefail
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add app/data/live/ app/data/exhibition/ app/data/experiments/ app/data/venue-profiles.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: automatic nationwide forecast snapshots and results'
            # Retry on latest immutable ledger, never overwrite competing records.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "Forecast save retry exhausted" >&2
                exit 1
              fi
              git fetch origin main
              git reset --hard origin/main
              python scripts/ingest_boatracecsv_exhibition.py
              python scripts/autonomous_daily.py | tee boat-lab-daily-status.json
              python scripts/forecast_audit.py --input app/data/live/latest.json --out app/data/live/audit-latest.json
              node scripts/freeze_tactical_trials.js
              node scripts/freeze_outside_trials.js
              node scripts/freeze_coupling_trials.js
              node scripts/freeze_start_trials.js
              git add app/data/live/ app/data/exhibition/ app/data/experiments/ app/data/venue-profiles.json
              if git diff --cached --quiet; then
                break
              fi
              git commit -m 'data: retry fresh pre-cutoff forecasts on latest ledger'
            done
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload BOAT LAB web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: './app'
      - name: Deploy site
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Keep run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-lab-auto-status
          path: boat-lab-daily-status.json
          if-no-files-found: ignore
          retention-days: 3
