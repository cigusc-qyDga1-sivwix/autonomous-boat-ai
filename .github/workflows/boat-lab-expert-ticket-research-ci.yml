name: BOAT LAB expert ticket portfolio forward research CI
on:
  pull_request:
    paths:
      - 'scripts/expert_scenario_portfolio_shadow.py'
      - 'scripts/learned_formal.py'
      - 'scripts/original_venue_formal_v1.py'
      - 'scripts/autonomous_daily.py'
      - 'scripts/forecast_audit.py'
      - 'tests/test_expert_scenario_portfolio_shadow.py'
      - '.github/workflows/boat-lab-expert-ticket-research-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/expert_scenario_portfolio_shadow.py'
      - 'scripts/learned_formal.py'
      - 'scripts/original_venue_formal_v1.py'
      - 'scripts/autonomous_daily.py'
      - 'scripts/forecast_audit.py'
      - 'tests/test_expert_scenario_portfolio_shadow.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -q -e '.[test,research]'
      - run: python -m compileall -q scripts/expert_scenario_portfolio_shadow.py scripts/learned_formal.py scripts/original_venue_formal_v1.py scripts/forecast_audit.py
      - run: python -m pytest -q tests/test_expert_scenario_portfolio_shadow.py tests/test_learned_formal.py tests/test_original_venue_formal_v1.py tests/test_race_flow_experimental_primary.py tests/test_learned_conditional_shadow.py
