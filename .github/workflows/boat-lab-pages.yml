name: Publish BOAT LAB PWA
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/boat-lab-pages.yml'
  workflow_dispatch:
  # Bot-owned forecast/result commits never trigger another push workflow.
  # A moderate scheduled static publication is the fallback; the PWA now
  # checks the actual canonical GitHub ledger every visible minute.
  # Publishing ~860MB on every 3-5 minute data run caused >10-minute
  # Pages syncing_files jobs and deployment failures.
  schedule:
    - cron: '0,15,30,45 21-23 * * *'
    - cron: '0,15,30,45 0-14 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # Replace a previously stalled, obsolete heavy artifact when a newer static
  # release has been prepared. Current Pages stays available until publish.
  # Only this single workflow can deploy and the new 15-min schedule is sparse.
  group: boat-lab-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Resolve main when this serialized job starts, never the triggering old SHA.
          ref: main
      - name: Record published repository revision
        run: git rev-parse HEAD
      - name: Build lightweight, archival-safe Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_pages_site.py --app app --out "$RUNNER_TEMP/boat-lab-pages-site"
          test -s "$RUNNER_TEMP/boat-lab-pages-site/data/live/latest.json"
          test -s "$RUNNER_TEMP/boat-lab-pages-site/canonical-exhibition-feed.js"
          du -sh "$RUNNER_TEMP/boat-lab-pages-site"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload BOAT LAB site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/boat-lab-pages-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
