name: BOAT LAB point-free trial day watchdog 2026-10-28
on:
  workflow_dispatch:
  schedule:
    # One trial day: 2026-10-27 21:02 UTC = 10/28 06:02 JST.
    # In later years the fixed-day script immediately exits as expired.
    - cron: '2 21 27 10 *'
permissions:
  contents: read
  actions: write
concurrency:
  group: boat-lab-point-free-20261028
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        shift: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Keep the existing collector current during the one-day trial
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -u scripts/prediction_watchdog.py --day 2026-10-28 --minutes 345 --start-hour 6
