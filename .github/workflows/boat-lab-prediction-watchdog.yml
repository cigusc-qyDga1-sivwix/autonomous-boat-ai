name: BOAT LAB continuous prediction watchdog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boat-lab-prediction-watchdog.yml'
      - 'scripts/prediction_watchdog.py'
      - 'tests/test_prediction_watchdog.py'
  schedule:
    - cron: '41 20 * * *'
    - cron: '41 2,8,14 * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: boat-lab-continuous-prediction-watchdog
  cancel-in-progress: false
jobs:
  initialize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      day: ${{ steps.clock.outputs.day }}
    steps:
      - id: clock
        run: echo "day=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
  monitor:
    needs: initialize
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        shift: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate forecast-only freshness recovery
        run: |
          python -m pip install pytest
          python -m pytest tests/test_prediction_watchdog.py -q
      - name: Keep existing prediction collector running through today's close
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -u -m scripts.prediction_watchdog --day '${{ needs.initialize.outputs.day }}' --minutes 345 --start-hour 6
  continue-watch:
    needs: [initialize, monitor]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.initialize.result == 'success' && needs.monitor.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Queue the next bounded prediction watch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          from scripts.official_results_watchdog import Client
          client = Client(os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_TOKEN'])
          client.request(client.api + '/actions/workflows/boat-lab-prediction-watchdog.yml/dispatches', {'ref': 'main'})
          print('Queued the next bounded prediction watch; cron remains the backup.')
          PY
