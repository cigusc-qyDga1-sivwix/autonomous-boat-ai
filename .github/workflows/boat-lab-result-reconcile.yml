name: BOAT LAB official result backlog reconciliation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/reconcile_official_backlog.py'
      - 'tests/test_reconcile_official_backlog.py'
      - '.github/workflows/boat-lab-result-reconcile.yml'
  schedule:
    # Best-effort JST daytime every 10 minutes; actual GitHub cron can lag.
    - cron: '3-59/10 21-23 * * *'
    - cron: '3-59/10 0-14 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  # Serialize with the forecast workflow to avoid two writers of the daily ledger.
  group: boat-lab-nationwide
  cancel-in-progress: false
jobs:
  reconcile-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable forecast and conflict safeguards
        run: python -m unittest discover -s tests -p 'test_reconcile_official_backlog.py' -v
      - name: Recheck official payouts and retry results-only saves on the latest ledger
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Recompute on the latest ledger instead of rebasing stale JSON over
          # concurrent result/forecast updates. Frozen versions remain untouched.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -m scripts.reconcile_official_backlog --days 5
            python -m json.tool app/data/live/result-sync-latest.json > /dev/null
            git add app/data/live/
            if git diff --cached --quiet; then
              break
            fi
            git commit -m 'data: catch up verified official race settlements'
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Official backlog save retries exhausted" >&2
              exit 1
            fi
            sleep 2
          done
      # Successful completion wakes the single Pages publisher, including bot commits.
