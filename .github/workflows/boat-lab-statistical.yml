name: BOAT LAB statistical training and temporal audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'boat_ai/statistical.py'
      - 'scripts/train_statistical.py'
      - 'scripts/freeze_statistical_shadow.py'
      - 'scripts/audit_statistical_shadow.py'
      - 'tests/test_statistical.py'
      - '.github/workflows/boat-lab-statistical.yml'
  schedule:
    - cron: '10 19 * * *' # 04:10 JST; best-effort GitHub schedule
permissions:
  contents: write
concurrency:
  group: boat-lab-statistical-training
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test,research]'
      - run: python -m pytest -q tests/test_statistical.py
      - name: Train from previous days only and evaluate by held-out date
        run: python -m scripts.train_statistical
      - name: Freeze current future-race comparisons
        run: |
          python -m scripts.freeze_statistical_shadow
          python -m scripts.audit_statistical_shadow
      - name: Save model artifacts without replacing forecast ledgers
        shell: bash
        run: |
          set -euo pipefail
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          for attempt in 1 2 3; do
            git add app/data/statistical/ app/data/experiments/statistical-*.json
            if git diff --cached --quiet; then break; fi
            git commit -m 'data: learned statistical model and prospective comparisons'
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python -m scripts.train_statistical
            python -m scripts.freeze_statistical_shadow
            python -m scripts.audit_statistical_shadow
          done
