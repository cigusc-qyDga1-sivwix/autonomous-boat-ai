name: BOAT LAB strong-field pre-cutoff diagnostics tests
on:
  push:
    paths:
      - 'scripts/strong_field_diagnostic.py'
      - 'scripts/autonomous_daily.py'
      - 'scripts/forecast_audit.py'
      - 'tests/test_strong_field_diagnostic.py'
      - 'app/app.js'
      - '.github/workflows/boat-lab-strong-field-tests.yml'
  pull_request:
    paths:
      - 'scripts/strong_field_diagnostic.py'
      - 'scripts/autonomous_daily.py'
      - 'scripts/forecast_audit.py'
      - 'tests/test_strong_field_diagnostic.py'
      - 'app/app.js'
      - '.github/workflows/boat-lab-strong-field-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q scripts/autonomous_daily.py scripts/strong_field_diagnostic.py scripts/forecast_audit.py
      - run: python -m pip install -q pytest
      - run: python -m pytest -q tests/test_strong_field_diagnostic.py
      - run: node --check app/app.js
