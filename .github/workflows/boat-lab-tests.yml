name: BOAT LAB static app tests
on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/boat-lab-tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/boat-lab-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/test_entry_exhibition_gate.py
      - run: node --check app/app.js
      - run: node --check app/exhibition-research.js
      - run: node --check app/exhibition-audit.js
      - run: node app/tests/exhibition-audit.test.js
      - run: node --check app/venue-board.js
      - run: node app/tests/smoke.test.js
      - run: node app/tests/live.test.js
      - run: node app/tests/entry-exhibition-ui.test.js
      - run: node app/tests/venue-board.test.js
      - run: node app/tests/venue-navigation.test.js
      - run: node --check app/mobile-race-nav.js
      - run: node app/tests/mobile-race-navigation.test.js
      - run: node app/tests/weather-ui.test.js
      - run: node --check app/cumulative-settlement.js
      - run: node app/tests/cumulative-settlement.test.js
      - run: node --check app/boaters-reference.js
      - run: node --check app/forecast-reanalysis.js
      - run: node --check app/race-visual.js
      - run: node app/tests/race-visual.test.js
      - run: node app/tests/entry-prediction-advantage.test.js
      - run: node --check app/racer-rating.js
      - run: node --check app/racer-rating-panel.js
      - run: node app/tests/racer-rating.test.js
      - run: node app/tests/wake-animation.test.js
      - run: node app/tests/race-timeline.test.js
      - run: node --check app/tactical-1m.js
      - run: node app/tests/tactical-1m.test.js
      - run: node app/tests/role-alignment-v04.test.js
      - run: node app/tests/outside-role-v05.test.js
      - run: node app/tests/six-boat-coupling-v06.test.js
      - run: node app/tests/outside-start-gap-v07.test.js
      - run: node app/tests/forward-start-gap-v07.test.js
      - run: python3 -m scripts.test_research_start_gap
      - run: node app/tests/forward-coupling-freeze.test.js
      - run: python3 -m scripts.test_research_coupling_patterns
      - run: python3 scripts/test_research_outside_roles.py
      - run: node app/tests/forward-tactical-freeze.test.js
      - run: node --check scripts/freeze_outside_trials.js
      - run: node app/tests/tactical-outside-v02.test.js
      - run: node --check scripts/freeze_wake_trials.js
      - run: node app/tests/wake-attrition-v03.test.js
      - run: node app/tests/outside-view.test.js
      - run: node app/tests/tactical-daily-comparison.test.js
      - run: node app/tests/tactical-ui-integration.test.js
      - run: node app/tests/primary-v07-ui.test.js
      - run: node --check scripts/main_v07_bridge.js
      - run: node app/tests/race-tactics.test.js
      - run: node app/tests/first-mark-geometry.test.js
      - run: node --check app/venue-profiles.js
      - run: node app/tests/venue-profiles.test.js
      - run: node app/tests/intelligence-dashboard.test.js
      - run: node --check app/rebuild-20261023.js
      - run: node app/tests/rebuild-day.test.js
      - run: node app/tests/race-visual-controls.test.js
      - run: node app/tests/forecast-reanalysis.test.js
      - run: node app/tests/reanalysis-execute-button.test.js
      - run: node app/tests/exhibition-autofill.test.js
      - run: node --check app/exhibition-direct.js
      - run: node app/tests/exhibition-direct.test.js
      - run: node app/tests/official-settlement.test.js
      - run: node --check app/result-reader.js
      - run: node --check app/batch-result-reader.js
      - run: node app/tests/batch-result-reader.test.js
      - run: node app/tests/batch-result-integration.test.js
      - run: node app/tests/result-reader.test.js
      - run: node app/tests/result-reader-integration.test.js
      - run: node --check app/result-quickboard.js
      - run: node app/tests/result-quickboard.test.js
      - run: node app/tests/result-quickboard-integration.test.js
      - run: node app/tests/results-refresh.test.js
      - run: node app/tests/boaters-reference.test.js
