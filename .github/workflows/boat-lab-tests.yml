name: BOAT LAB static app tests
on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/boat-lab-tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/boat-lab-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/app.js
      - run: node --check app/venue-board.js
      - run: node app/tests/smoke.test.js
      - run: node app/tests/live.test.js
      - run: node app/tests/venue-board.test.js
      - run: node app/tests/venue-navigation.test.js
