name: BOAT LAB static app tests
on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/boat-lab-tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/boat-lab-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/app.js
      - run: node --check app/venue-board.js
      - run: node app/tests/smoke.test.js
      - run: node app/tests/live.test.js
      - run: node app/tests/venue-board.test.js
      - run: node app/tests/venue-navigation.test.js
      - run: node app/tests/weather-ui.test.js
      - run: node --check app/boaters-reference.js
      - run: node --check app/forecast-reanalysis.js
      - run: node --check app/race-visual.js
      - run: node app/tests/race-visual.test.js
      - run: node app/tests/race-visual-controls.test.js
      - run: node app/tests/forecast-reanalysis.test.js
      - run: node app/tests/official-settlement.test.js
      - run: node --check app/result-reader.js
      - run: node app/tests/result-reader.test.js
      - run: node app/tests/result-reader-integration.test.js
      - run: node app/tests/results-refresh.test.js
      - run: node app/tests/boaters-reference.test.js
