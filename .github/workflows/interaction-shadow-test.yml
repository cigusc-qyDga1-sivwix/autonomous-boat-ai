name: Interaction scenario shadow tests
on:
  pull_request:
    paths:
      - 'scripts/interaction_scenarios.py'
      - 'tests/test_interaction_scenarios.py'
      - 'tests/test_interaction_main.py'
      - 'tests/test_actual_entry_primary.py'
      - 'scripts/autonomous_daily.py'
      - '.github/workflows/interaction-shadow-test.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_interaction_scenarios.py tests/test_interaction_main.py tests/test_actual_entry_primary.py
      - run: python -m pytest -q
