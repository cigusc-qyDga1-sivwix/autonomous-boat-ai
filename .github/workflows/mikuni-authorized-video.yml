name: BOAT LAB Mikuni authorized video research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/mikuni_video_autocollect.py'
      - 'tests/test_mikuni_video_autocollect.py'
      - '.github/workflows/mikuni-authorized-video.yml'
  schedule:
    # Mikuni morning schedule; GitHub may delay/skip scheduled jobs.
    # JST 08:08-14:58 during scheduled meets (non-meeting dates stay idle).
    - cron: '8,18,28,38,48,58 23 * * *'
    - cron: '8,18,28,38,48,58 0-5 * * *'

permissions:
  contents: write

concurrency:
  group: boat-lab-mikuni-authorized-video
  cancel-in-progress: false

jobs:
  source-only-research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # User-reported venue consent is NOT a direct media endpoint.
      # Provide an authorized direct HTTPS file URL template separately.
      MIKUNI_VIDEO_SOURCE_TEMPLATE: ${{ secrets.MIKUNI_VIDEO_SOURCE_TEMPLATE }}
      MIKUNI_VIDEO_ALLOWED_HOSTS: ${{ vars.MIKUNI_VIDEO_ALLOWED_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Mikuni source guard and idempotence
        run: |
          python -m compileall -q scripts/mikuni_video_autocollect.py
          python -m unittest discover -s tests -p test_mikuni_video_autocollect.py
      - name: Install research video decoder only when source is configured
        if: env.MIKUNI_VIDEO_SOURCE_TEMPLATE != '' && env.MIKUNI_VIDEO_ALLOWED_HOSTS != ''
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.11.0.86
      - name: Research only - collect authorized Mikuni direct media
        run: |
          set -euo pipefail
          DAY=$(TZ=Asia/Tokyo date +%F)
          python scripts/mikuni_video_autocollect.py --date "$DAY"
          python -m json.tool "app/data/experiments/mikuni-video-auto-${DAY}.json" >/dev/null
      - name: Save research ledger without video content or forecast modifications
        run: |
          set -euo pipefail
          DAY=$(TZ=Asia/Tokyo date +%F)
          FILE="app/data/experiments/mikuni-video-auto-${DAY}.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "No research state change"
            exit 0
          fi
          git commit -m 'data: Mikuni authorized video source research status'
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$i" = 3 ]; then
              echo 'Video research status could not be persisted' >&2
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main
            # No forecasts are modified here, no previously accepted source SHA is overwritten.
            python scripts/mikuni_video_autocollect.py --date "$DAY"
            git add "$FILE"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'data: retry Mikuni authorized video research status'
          done
