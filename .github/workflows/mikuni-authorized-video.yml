name: BOAT LAB Mikuni authorized video research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/mikuni_video_autocollect.py'
      - 'scripts/mikuni_video_ephemeral.py'
      - 'scripts/mikuni_six_boat_tracker.py'
      - 'scripts/mikuni_video_shadow.py'
      - 'scripts/mikuni_official_video_catalog.py'
      - 'tests/test_mikuni_video_autocollect.py'
      - 'tests/test_mikuni_video_motion_pipeline.py'
      - 'tests/test_mikuni_six_boat_tracker.py'
      - 'tests/test_mikuni_official_video_catalog.py'
      - '.github/workflows/mikuni-authorized-video.yml'
  schedule:
    # Mikuni morning schedule; GitHub may delay/skip scheduled jobs.
    # JST 08:08-14:58 during scheduled meets (non-meeting dates stay idle).
    - cron: '8,18,28,38,48,58 23 * * *'
    - cron: '8,18,28,38,48,58 0-5 * * *'

permissions:
  contents: write

concurrency:
  group: boat-lab-mikuni-authorized-video
  cancel-in-progress: false

jobs:
  source-only-research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # User-reported venue consent is NOT a direct media endpoint.
      # Provide an authorized direct HTTPS file URL template separately.
      MIKUNI_VIDEO_SOURCE_TEMPLATE: ${{ secrets.MIKUNI_VIDEO_SOURCE_TEMPLATE }}
      MIKUNI_VIDEO_ALLOWED_HOSTS: ${{ vars.MIKUNI_VIDEO_ALLOWED_HOSTS }}
      MIKUNI_YOUTUBE_DATA_API_KEY: ${{ secrets.MIKUNI_YOUTUBE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Mikuni source guard and idempotence
        run: |
          python -m compileall -q scripts/mikuni_video_autocollect.py
          python -m unittest discover -s tests -p test_mikuni_video_autocollect.py
          python -m unittest discover -s tests -p test_mikuni_video_motion_pipeline.py
          python -m unittest discover -s tests -p test_mikuni_six_boat_tracker.py
          python -m unittest discover -s tests -p test_mikuni_official_video_catalog.py
      - name: Discover Mikuni venue-specified official YouTube channel metadata
        run: |
          set -euo pipefail
          DAY=$(TZ=Asia/Tokyo date +%F)
          python scripts/mikuni_official_video_catalog.py --date "$DAY"
          python -m json.tool "app/data/experiments/mikuni-video-catalog-${DAY}.json" >/dev/null
          # Only channel/entry metadata; does NOT download YouTube videos.
      - name: Install research video decoder only when source is configured
        if: env.MIKUNI_VIDEO_SOURCE_TEMPLATE != '' && env.MIKUNI_VIDEO_ALLOWED_HOSTS != ''
        run: python -m pip install --disable-pip-version-check opencv-python-headless==4.11.0.86
      - name: Research only - receive and decode authorized Mikuni media in memory
        run: |
          set -euo pipefail
          DAY=$(TZ=Asia/Tokyo date +%F)
          python -m scripts.mikuni_video_ephemeral --date "$DAY"
          python -m json.tool "app/data/experiments/mikuni-video-auto-${DAY}.json" >/dev/null
          # Raw media and frames are never written to disk; only numeric JSON.
      - name: Freeze independent verified six-boat motion shadow before cutoff only
        run: |
          set -euo pipefail
          DAY=$(TZ=Asia/Tokyo date +%F)
          python scripts/mikuni_video_shadow.py --date "$DAY"
          python -m json.tool "app/data/experiments/mikuni-video-shadow-${DAY}.json" >/dev/null
          # Zero verified tracks -> zero shadow bets. Never rewrites formal v1.5.
      - name: Save research ledger without video content or forecast modifications
        run: |
          set -euo pipefail
          DAY=$(TZ=Asia/Tokyo date +%F)
          FILE="app/data/experiments/mikuni-video-auto-${DAY}.json"
          CATALOG="app/data/experiments/mikuni-video-catalog-${DAY}.json"
          SHADOW="app/data/experiments/mikuni-video-shadow-${DAY}.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE" "$CATALOG" "$SHADOW"
          if git diff --cached --quiet; then
            echo "No research state change"
            exit 0
          fi
          git commit -m 'data: Mikuni authorized video source research status'
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$i" = 3 ]; then
              echo 'Video research status could not be persisted' >&2
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main
            # No forecasts are modified here, no previously accepted source SHA is overwritten.
            python scripts/mikuni_official_video_catalog.py --date "$DAY"
            python -m scripts.mikuni_video_ephemeral --date "$DAY"
            python scripts/mikuni_video_shadow.py --date "$DAY"
            git add "$FILE" "$CATALOG" "$SHADOW"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'data: retry Mikuni authorized video research status'
          done
