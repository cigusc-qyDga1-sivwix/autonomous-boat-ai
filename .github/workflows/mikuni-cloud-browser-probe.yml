name: BOAT LAB Mikuni cloud browser UI reachability
on:
  workflow_dispatch:
  push:
    branches:
      - feat/mikuni-cloud-browser-readonly-probe-20261031
      - feat/mikuni-cloud-day-scoped-archive-audit-20261031
      - feat/mikuni-cloud-verified-replay-play-20261031
      - fix/mikuni-cloud-accordion-state-20261031
    paths:
      - 'scripts/mikuni_cloud_browser_probe.py'
      - 'scripts/mikuni_cloud_frame_research.py'
      - 'tests/test_mikuni_cloud_frame_research.py'
      - 'tests/test_mikuni_cloud_browser_probe.py'
      - '.github/workflows/mikuni-cloud-browser-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert no false real-video success
        run: |
          python -m pip install numpy opencv-python-headless
          python -m unittest discover -s tests -p 'test_mikuni_cloud_browser_probe.py' -v
          python -m unittest discover -s tests -p 'test_mikuni_cloud_frame_research.py' -v
      - name: Install browser controller only
        run: python -m pip install playwright
      - name: Official JLC PC UI read-only check
        run: python -m scripts.mikuni_cloud_browser_probe --date 2026-10-28 --race 1 --try-player --out app/data/experiments/mikuni-cloud-browser-probe-2026-10-28.json
      - name: Compare official replay with headed Edge on hosted Windows
        run: python -m scripts.mikuni_cloud_browser_probe --date 2026-10-28 --race 1 --try-player --headed --out app/data/experiments/mikuni-cloud-browser-probe-headed-2026-10-28.json
      - uses: actions/upload-artifact@v4
        with:
          name: mikuni-cloud-browser-ui-diagnostic
          path: app/data/experiments/mikuni-cloud-browser-probe*2026-10-28.json
          retention-days: 7
