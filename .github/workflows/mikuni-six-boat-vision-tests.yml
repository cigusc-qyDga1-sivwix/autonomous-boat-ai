name: BOAT LAB six-boat vision synthetic integration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/mikuni_six_boat_tracker.py'
      - 'scripts/mikuni_video_ephemeral.py'
      - 'tests/test_mikuni_six_boat_tracker.py'
      - '.github/workflows/mikuni-six-boat-vision-tests.yml'
  pull_request:
    paths:
      - 'scripts/mikuni_six_boat_tracker.py'
      - 'scripts/mikuni_video_ephemeral.py'
      - 'tests/test_mikuni_six_boat_tracker.py'
      - '.github/workflows/mikuni-six-boat-vision-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  klt-six-boat-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual CV decoder for synthetic tracking
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 opencv-python-headless==4.11.0.86
      - name: Run six-boat camera motion regression
        run: python -m unittest discover -s tests -p test_mikuni_six_boat_tracker.py -v
      - name: Verify RAM video and pre-cutoff shadow regression
        run: python -m unittest discover -s tests -p test_mikuni_video_motion_pipeline.py -v
      - name: Prove OpenCV synthetic tests were not skipped
        run: |
          python -c "import cv2,numpy;print('cv2',cv2.__version__,'numpy',numpy.__version__)"
