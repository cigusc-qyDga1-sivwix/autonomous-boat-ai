name: BOAT LAB Windows Edge no-Docker probe tests

on:
  push:
    branches:
      - feat/mikuni-windows-edge-no-docker-20261028
      - fix/mikuni-edge-popup-api-20261028
      - fix/mikuni-edge-popup-host-audit-20261028
      - fix/mikuni-edge-popup-http-scheme-20261028
      - fix/mikuni-day-scoped-autoclick-20261028
      - fix/mikuni-edge-replay-popup-origin-20261028
      - fix/mikuni-visible-edge-compare-20261028
      - fix/mikuni-cdp-popup-origin-observation-20261029
      - fix/mikuni-optin-unblock-and-hitcheck-20261029
      - fix/mikuni-autoplay-no-direct-file-not-found-20261029
      - fix/mikuni-autoplay-same-tab-20261029
    paths:
      - scripts/check_mikuni_edge_nodocker.ps1
      - .github/workflows/mikuni-windows-edge-nodocker-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows-check:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Parse native Windows PowerShell script
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/check_mikuni_edge_nodocker.ps1').Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Output 'Windows PowerShell 5.1 syntax passed'
      - name: Headless Microsoft Edge local CDP smoke test (no network)
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/check_mikuni_edge_nodocker.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Exercise public Mikuni replay UI without downloading media
        shell: powershell
        run: |
          $jsonLines = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/check_mikuni_edge_nodocker.ps1 -Date 2026-10-28 -Race 1
          $nativeExit = $LASTEXITCODE
          $audit = ($jsonLines | Out-String) | ConvertFrom-Json
          if ($audit.schema -ne 'boatlabs.mikuni_edge_nodocker.v1') { exit 1 }
          if ($audit.video_bytes_saved -ne 0 -or $audit.video_frames_decoded -ne 0) { exit 1 }
          if ($audit.edge_start_mode -ne 'HEADLESS_ISOLATED') { exit 1 }
          if ($audit.fetch_mode_at_race_click -ne 'BLOCKED_DIAGNOSTIC') { exit 1 }
          if ($audit.race_click_status -eq 'TRUSTED_MOUSE_CLICK_EXACT_DAY_AND_RACE' -and
              $audit.race_click_hit_verified -ne $true) { exit 1 }
          if ($audit.race_click_status -eq 'TRUSTED_MOUSE_CLICK_EXACT_DAY_AND_RACE') {
            if ($audit.race_icon_target_day_matches -ne 1) { exit 1 }
          }
          if ($audit.window_open_events -lt 0) { exit 1 }
          if ($audit.window_open_kind -eq 'OFFICIAL_PLAYER_MATCHED' -and $audit.window_open_events -eq 0) { exit 1 }
          if ($audit.race_click_status -eq 'TRUSTED_MOUSE_CLICK_EXACT_DAY_AND_RACE') {
          }
          $audit | Select-Object access_decision,landing_http_status,race_click_status,race_icon_matches,race_icon_visible_exact,race_icon_target_day_matches,meeting_header_clicked,day_header_clicked,browser_tabs_after_click,new_tab_domain,new_tab_url_type,new_tab_internal_kind,new_tab_guard_status,race_link_kind,race_link_host,race_link_target,race_link_has_inline_handler,playback_api_statuses,media_requests_blocked,failure_stage,failure_exception_type,failure_script_line | ConvertTo-Json -Depth 5
          Write-Output ("diagnostic_exit=" + $nativeExit + " (0 is API metadata 2xx, 2 may mean blocked or unavailable)")
          exit 0
      - name: Inspect public JLC race icon ancestors, no replay click or media
        shell: powershell
        run: |
          $lines = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/check_mikuni_edge_nodocker.ps1 -Date 2026-10-28 -Race 1 -LayoutAudit
          $audit = ($lines | Out-String) | ConvertFrom-Json
          if ($audit.video_bytes_saved -ne 0) { exit 1 }
          $audit | Select-Object access_decision,landing_http_status,race_click_status,meeting_header_clicked,day_header_clicked,race_icon_matches,race_link_kind,race_link_host,race_link_target,race_link_has_inline_handler,layout_hints | ConvertTo-Json -Depth 14
          exit 0
