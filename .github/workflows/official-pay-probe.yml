name: BOAT LAB official payout probe
on:
  push:
    paths:
      - 'scripts/probe_official_pay.py'
      - 'scripts/official_pay.py'
      - '.github/workflows/official-pay-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse official payout page with strict checks
        run: python scripts/official_pay.py 20261022
