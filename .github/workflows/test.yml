name: Tests
on:
  push:
    # Branch-only WEATHER LAB snapshots should not trigger large BOAT LAB tests.
    paths-ignore:
      - 'weather_lab/data/**'
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test,research]'
      - run: python -m pytest -q
      # Production gate used by nationwide forecasts: verify here before merge.
      - run: python scripts/test_entry_exhibition_gate.py
      - run: python scripts/test_exhibition_ingest_optional_weather.py
      - run: python -m unittest discover -s weather_lab/tests -p 'test_*.py' -v
      - run: python scripts/test_exhibition_rejection_audit.py
      - run: python scripts/forecast_audit.py --input app/data/live/latest.json --out /tmp/forecast-audit-smoke.json
