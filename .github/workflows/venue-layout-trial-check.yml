name: Venue layout trial checks
on:
  push:
    branches:
      - 'feat/venue-layout-toda-fukuoka-karatsu-v12-20261027'
  pull_request:
    paths:
      - 'app/tactical-1m.js'
      - 'app/tests/venue-layout-trial.test.js'
      - 'app/tests/four-factor.test.js'
      - '.github/workflows/venue-layout-trial-check.yml'
permissions:
  contents: read
jobs:
  venue-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and branch invariants
        run: |
          node --check app/tactical-1m.js
          node app/tests/venue-layout-trial.test.js
          node app/tests/four-factor.test.js
      - name: Python baseline invariants
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q
