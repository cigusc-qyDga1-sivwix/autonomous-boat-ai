name: WEATHER LAB independent water-surface monitor

on:
  workflow_dispatch:
  # Backup trigger when GitHub's five-minute schedule is skipped or delayed.
  # BOAT LAB remains independent: only a successful same-repo event may start collection.
  workflow_run:
    workflows: ['BOAT LAB fast exhibition numeric capture']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'weather_lab/**'
      - '.github/workflows/weather-lab-monitor.yml'
  schedule:
    # JST 06:00–23:59, 5-minute best effort. Source is race snapshots,
    # not a continuously reporting weather station.
    - cron: '3-58/5 21-23 * * *'
    - cron: '3-58/5 0-14 * * *'

permissions:
  contents: write

concurrency:
  group: weather-lab-independent-collector
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Read only this project's code; bypass BOAT LAB's large race ledgers.
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /weather_lab/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check if backup trigger is already covered by recent collection
        if: github.event_name == 'workflow_run'
        id: backup_gate
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/cigusc-qyDga1-sivwix/autonomous-boat-ai/weather-lab-data/weather_lab/data/latest.json'
          if curl --fail --silent --show-error --location --max-time 8 "$URL?ts=$(date +%s)" -o "$RUNNER_TEMP/weather-last.json"; then
            if python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          try:
              with open(os.path.join(os.environ['RUNNER_TEMP'], 'weather-last.json'), encoding='utf-8') as fp:
                  doc = json.load(fp)
              now = datetime.now(timezone.utc)
              collected = datetime.fromisoformat(doc['collected_at_utc'].replace('Z', '+00:00'))
              age = (now - collected).total_seconds()
              same_day = doc['event_date'] == now.astimezone(ZoneInfo('Asia/Tokyo')).date().isoformat()
              raise SystemExit(0 if same_day and -90 <= age <= 240 else 1)
          except (OSError, ValueError, KeyError, TypeError):
              raise SystemExit(1)
          PY
            then
              echo 'Backup trigger skipped: WEATHER LAB already collected within four minutes'
              echo 'collect=no' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'collect=yes' >> "$GITHUB_OUTPUT"
      - name: Offline schema, date and source-safety checks
        if: github.event_name != 'workflow_run' || steps.backup_gate.outputs.collect == 'yes'
        run: python -m unittest discover -s weather_lab/tests -p 'test_*.py' -v
      - name: Collect public race-based weather snapshots
        if: github.event_name != 'workflow_run' || steps.backup_gate.outputs.collect == 'yes'
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(TZ=Asia/Tokyo date +%F)"
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/weather-lab-data"
          python -m weather_lab.monitor --date "$DAY" --out-dir "$RUNNER_TEMP/weather-lab-data"
          python -m json.tool "$RUNNER_TEMP/weather-lab-data/latest.json" > /dev/null
      - name: Commit only WEATHER LAB data to its independent data branch
        if: github.event_name != 'workflow_run' || steps.backup_gate.outputs.collect == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          DAY="${{ steps.capture.outputs.day }}"
          if [ "$(TZ=Asia/Tokyo date +%F)" != "$DAY" ]; then
            echo '::warning::JST day changed during collection; skip outdated publication'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp weather_lab/forward_freeze.py "$RUNNER_TEMP/weather-forward-freeze.py"
          for attempt in 1 2 3; do
            if git ls-remote --exit-code --heads origin weather-lab-data >/dev/null 2>&1; then
              git fetch origin +refs/heads/weather-lab-data:refs/remotes/origin/weather-lab-data
              git checkout -q -B weather-lab-data origin/weather-lab-data
            else
              # Created from main only once; avoids a dependency on a new
              # GitHub repository creation permission.
              git checkout -q -B weather-lab-data origin/main
            fi
            mkdir -p weather_lab/data
            cp "$RUNNER_TEMP/weather-lab-data/latest.json" weather_lab/data/latest.json
            if [ -f "$RUNNER_TEMP/weather-lab-data/$DAY.json" ]; then
              cp "$RUNNER_TEMP/weather-lab-data/$DAY.json" "weather_lab/data/$DAY.json"
            fi
            # The weather archive is append-only: first trustworthy pre-cutoff capture wins.
            # Recalculate against the latest remote branch on every push retry.
            mkdir -p weather_lab/data/forward "$RUNNER_TEMP/weather-lab-data/forward"
            PREVIOUS="$RUNNER_TEMP/weather-existing-forward-$DAY.json"
            rm -f "$PREVIOUS"
            if [ -s "weather_lab/data/forward/$DAY.json" ]; then
              cp "weather_lab/data/forward/$DAY.json" "$PREVIOUS"
            fi
            python "$RUNNER_TEMP/weather-forward-freeze.py" \
              --snapshot "$RUNNER_TEMP/weather-lab-data/latest.json" \
              --previous "$PREVIOUS" \
              --out "$RUNNER_TEMP/weather-lab-data/forward/$DAY.json"
            cp "$RUNNER_TEMP/weather-lab-data/forward/$DAY.json" "weather_lab/data/forward/$DAY.json"
            git add weather_lab/data/
            if git diff --cached --quiet; then
              echo 'WEATHER LAB data already current'
              break
            fi
            git commit -m "weather: independent 24-venue source freshness snapshot $DAY"
            if git push origin HEAD:refs/heads/weather-lab-data; then
              echo 'WEATHER LAB published; BOAT LAB main unchanged'
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo '::error::WEATHER LAB data branch update failed after retry'
              exit 1
            fi
            # No force push, no modifications to BOAT LAB predictions.
            git fetch origin +refs/heads/weather-lab-data:refs/remotes/origin/weather-lab-data
            git reset --hard origin/weather-lab-data
            sleep 2
          done
